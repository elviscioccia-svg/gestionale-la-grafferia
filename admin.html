<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Grafferia - Amministrazione</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#fff8f0;color:#29221e}
h1{text-align:center;color:#8b3f16}
.card{background:white;padding:16px;margin:12px 0;border-radius:15px;box-shadow:0 2px 9px #0002}
input,button,select{font-size:16px;padding:12px;border-radius:9px;border:1px solid #ccc}
input{width:100%;margin:7px 0}
button{background:#8b3f16;color:white;border:0;cursor:pointer}
.product{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.product strong{flex:1;min-width:130px}
.product select{max-width:190px}
.hidden{display:none}
#message{text-align:center;color:#8b3f16}
</style>
</head>
<body>

<h1>🍩 La Grafferia</h1>
<h2>Gestione disponibilità</h2>

<div id="login" class="card">
  <h3>Accesso amministratore</h3>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Accedi</button>
  <p id="loginMessage"></p>
</div>

<div id="panel" class="hidden">
  <div class="card">
    <strong>Sei nell'area amministratore</strong>
    <button id="logoutBtn">Esci</button>
  </div>
  <p id="message">Caricamento prodotti...</p>
  <div id="products"></div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth, signInWithEmailAndPassword, signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore, collection, onSnapshot, doc, setDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAPN-Ka5ZiT3ZMrbKQy6co9FsIH9LCuKS0",
  authDomain: "la-grafferia.firebaseapp.com",
  projectId: "la-grafferia",
  storageBucket: "la-grafferia.firebasestorage.app",
  messagingSenderId: "321541824206",
  appId: "1:321541824206:web:ba448c5b8c3e4573713a9f",
  measurementId: "G-YJ2T7ZK04S"
};

const ADMIN_UID = "Gnz9MFvmxUMRYGefePhlYNgDbP03";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const names = [
  "Graffa",
  "Cuoppo",
  "Bomba",
  "Cornetto",
  "Cornetto Ischitano",
  "Pangoccioli",
  "Cornetto Fritto",
  "Crêpes",
  "Waffle",
  "Pancake",
  "Churros"
];

const labels = {
  available: "Disponibile",
  soldout: "Esaurito",
  pending: "Da confermare"
};

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    document.getElementById("loginMessage").textContent =
      "Accesso non riuscito. Controlla email e password.";
  }
};

document.getElementById("logoutBtn").onclick =
  () => signOut(auth);

onAuthStateChanged(auth, user => {
  const login = document.getElementById("login");
  const panel = document.getElementById("panel");

  if (!user) {
    login.classList.remove("hidden");
    panel.classList.add("hidden");
    return;
  }

  if (user.uid !== ADMIN_UID) {
    signOut(auth);
    document.getElementById("loginMessage").textContent =
      "Questo account non è autorizzato.";
    return;
  }

  login.classList.add("hidden");
  panel.classList.remove("hidden");
  startProducts();
});

let unsubscribe;

function startProducts() {
  if (unsubscribe) unsubscribe();

  const productsRef = collection(db, "products");

  unsubscribe = onSnapshot(productsRef, async snapshot => {
    if (snapshot.empty) {
      for (const name of names) {
        await setDoc(doc(db, "products", slug(name)), {
          name,
          status: "pending"
        });
      }
      return;
    }

    const products = snapshot.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));

    render(products);
  }, error => {
    document.getElementById("message").textContent =
      "Errore nel caricamento. Controlla le regole Firestore.";
  });
}

function slug(name) {
  return name.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

function render(products) {
  const container = document.getElementById("products");
  container.innerHTML = "";

  names.forEach(name => {
    const product = products.find(p => p.name === name);
    if (!product) return;

    const card = document.createElement("div");
    card.className = "card product";

    const title = document.createElement("strong");
    title.textContent = "🍩 " + name;

    const select = document.createElement("select");

    Object.entries(labels).forEach(([value, label]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      select.appendChild(option);
    });

    select.value = product.status || "pending";

    select.onchange = async () => {
      select.disabled = true;
      try {
        await setDoc(doc(db, "products", product.id), {
          status: select.value
        }, { merge: true });

        document.getElementById("message").textContent =
          "Disponibilità aggiornata!";
      } catch (error) {
        document.getElementById("message").textContent =
          "Errore: modifica non salvata.";
      } finally {
        select.disabled = false;
      }
    };

    card.append(title, select);
    container.appendChild(card);
  });

  document.getElementById("message").textContent =
    "Prodotti collegati a Firebase.";
}
</script>
</body>
</html>
